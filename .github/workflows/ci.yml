name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - name: Smoke build PHAR (no upload)
        run: composer build
      - run: ./build/php-doctor.phar scan tests/fixtures/projects/symfony-min/ --format=json
