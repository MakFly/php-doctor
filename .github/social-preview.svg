<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- GitHub social preview for php-doctor -->
  <!-- 1280x640 is the GitHub-recommended OG image size -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- decorative grid (faint) -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0"   y1="160" x2="1280" y2="160"/>
    <line x1="0"   y1="320" x2="1280" y2="320"/>
    <line x1="0"   y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0"   x2="320"  y2="640"/>
    <line x1="640" y1="0"   x2="640"  y2="640"/>
    <line x1="960" y1="0"   x2="960"  y2="640"/>
  </g>

  <!-- left text block -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#f8fafc">
    <!-- logo mark: stylized stethoscope as PHP elephant snake -->
    <text x="80" y="170" font-size="56" font-weight="700" letter-spacing="-1.5">php-doctor</text>
    <text x="80" y="220" font-size="24" font-weight="500" fill="#cbd5e1">
      Symfony &amp; Laravel project health-audit CLI
    </text>

    <!-- bullet features -->
    <g font-size="20" fill="#94a3b8">
      <text x="80" y="300">
        <tspan fill="#22c55e">▸</tspan>
        <tspan dx="10">AST + runtime + PHPStan analysis</tspan>
      </text>
      <text x="80" y="340">
        <tspan fill="#22c55e">▸</tspan>
        <tspan dx="10">Lighthouse-style scored HTML report</tspan>
      </text>
      <text x="80" y="380">
        <tspan fill="#22c55e">▸</tspan>
        <tspan dx="10">SARIF 2.1.0 output for GitHub Code Scanning</tspan>
      </text>
      <text x="80" y="420">
        <tspan fill="#22c55e">▸</tspan>
        <tspan dx="10">Single-binary PHAR (~2.5 MB)</tspan>
      </text>
    </g>

    <!-- footer chip row -->
    <g font-size="16" font-weight="600">
      <rect x="80" y="500" width="120" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="140" y="521" text-anchor="middle" fill="#e2e8f0">PHP 8.3+</text>

      <rect x="212" y="500" width="120" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="272" y="521" text-anchor="middle" fill="#e2e8f0">Symfony 6/7/8</text>

      <rect x="344" y="500" width="160" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="424" y="521" text-anchor="middle" fill="#e2e8f0">Laravel 10/11/12/13</text>

      <rect x="516" y="500" width="100" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="566" y="521" text-anchor="middle" fill="#e2e8f0">MIT</text>
    </g>
  </g>

  <!-- right side: Lighthouse-style score gauge -->
  <g transform="translate(1000, 320)">
    <!-- ring background -->
    <circle r="170" fill="none" stroke="#1e293b" stroke-width="22"/>
    <!-- ring fill (98/100, ~3.5deg gap) -->
    <circle r="170" fill="none"
            stroke="url(#ringGradient)"
            stroke-width="22"
            stroke-linecap="round"
            stroke-dasharray="1046 23"
            transform="rotate(-90)"/>
    <!-- score number -->
    <text text-anchor="middle" dominant-baseline="central"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="120" font-weight="700" fill="#22c55e" y="-10">98</text>
    <text text-anchor="middle" dominant-baseline="central"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="22" font-weight="500" fill="#94a3b8" y="62">/ 100 health</text>
  </g>

  <!-- repo URL footer -->
  <text x="1200" y="612" text-anchor="end"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace"
        font-size="14" fill="#475569">
    github.com/MakFly/php-doctor
  </text>
</svg>
